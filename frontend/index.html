<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>%VITE_TITLE%</title>
    <script>
      ;(() => {
        function readStorage(storage, key) {
          try {
            return window[storage].getItem(key)
          } catch {
            return null
          }
        }

        function readAppearance(storage, key) {
          try {
            return JSON.parse(readStorage(storage, key))
          } catch {
            return null
          }
        }

        const root = document.documentElement
        const mode = readStorage('localStorage', 'vueuse-color-scheme')
        const isDark =
          mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.classList.add(isDark ? 'dark' : 'light')

        const appearance = readAppearance('localStorage', 'flow-appearance')
        const primary = appearance?.primaryColor ?? readAppearance('sessionStorage', 'app')?.primaryColor
        const palette = appearance?.loadingPalette
        const resolvedPrimary = palette?.source === primary ? palette?.[isDark ? 'dark' : 'light'] : undefined
        const style = document.createElement('span').style

        for (const color of [resolvedPrimary, primary]) {
          if (typeof color === 'string' && /^(?:#|rgba?\(|hsla?\()/i.test(color)) {
            style.color = color
            if (style.color) {
              root.style.setProperty('--flow-loading-color', color)
              break
            }
          }
        }
      })()
    </script>
    <style>
      .flow-loading {
        --flow-color: var(--flow-loading-color, #316c72);
        --flow-tint: color-mix(in srgb, var(--flow-color) 18%, transparent);
        --flow-surface: #fff;
        --flow-text: #243b40;
        --flow-muted: #607174;
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--flow-surface);
        color: var(--flow-text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .dark .flow-loading {
        --flow-color: var(--flow-loading-color, #598b8e);
        --flow-surface: #18181c;
        --flow-text: #e5eeee;
        --flow-muted: #8d9fa3;
      }

      .flow-loading__content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .flow-loading__mark {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--flow-color);
        color: #fff;
        color: contrast-color(var(--flow-color));
        box-shadow: 0 12px 36px var(--flow-tint);
      }

      .flow-loading__stream {
        stroke-dasharray: 7 25;
        animation: flow-stream 2s linear infinite;
      }

      .flow-loading__name {
        margin: 22px 0 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      .flow-loading__track {
        width: 112px;
        height: 3px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--flow-tint);
      }

      .flow-loading__track::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--flow-color);
        animation: flow-progress 1.8s ease-in-out infinite;
      }

      .flow-loading__label {
        margin: 12px 0 0;
        color: var(--flow-muted);
        font-size: 12px;
        letter-spacing: 0.12em;
      }

      @keyframes flow-stream {
        to {
          stroke-dashoffset: -32;
        }
      }

      @keyframes flow-progress {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(360%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow-loading__stream,
        .flow-loading__track::after {
          animation: none;
        }
        .flow-loading__track::after {
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body class="dark:text-#e9e9e9 auto-bg">
    <div id="app">
      <div class="flow-loading" role="status" aria-live="polite" aria-label="Flow 正在加载">
        <div class="flow-loading__content">
          <svg class="flow-loading__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path opacity="0.35" d="M7 9h3c5 0 4 7 9 7h6M7 23h3c5 0 4-7 9-7" />
              <path class="flow-loading__stream" d="M7 9h3c5 0 4 7 9 7h6" />
              <path class="flow-loading__stream" d="M7 23h3c5 0 4-7 9-7h6" />
              <path d="m21 12 4 4-4 4" />
            </g>
          </svg>
          <p class="flow-loading__name" aria-hidden="true">Flow</p>
          <div class="flow-loading__track" aria-hidden="true"></div>
          <p class="flow-loading__label" aria-hidden="true">正在加载</p>
        </div>
      </div>
    </div>
    <script>
      try {
        if (localStorage.getItem('flow-language') === 'en-US') {
          document.documentElement.lang = 'en-US'
          document.querySelector('.flow-loading').setAttribute('aria-label', 'Loading Flow')
          document.querySelector('.flow-loading__label').textContent = 'Loading'
        }
      } catch {
        // Storage can be disabled by the browser.
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
